  <link rel="stylesheet" href="/concepts/shared.css" />

<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">37ORBIT</div>
      <div class="nav"><a href="/concepts/index.html">返回概念目录</a><span>信号场</span></div>
    </div>
    <section class="surface signal-layout">
      <div class="signal-grid"></div>
      <div class="signal-path p1"></div>

      <div class="signal-node signal-project image-fill">
        <img src="/annual/2025/20251216-result44.png" alt="">

            <div class="title serif">一件代表性作品</div>
            <div class="meta">Primary Signal / Project / 2026</div>
          </div>
        </div>

      <div class="signal-node text signal-writing-a">

      <div class="signal-node text signal-writing-b">

      </div>

      <div class="signal-node signal-frame-a image-fill">
        <img src="/annual/2025/IMG_7318.jpeg" alt="">

      </div>

      <div class="signal-node signal-frame-b image-fill">
        <img src="/annual/2025/IMG_1116.jpeg" alt="">
        <div class="overlay-bottom"><div class="caption"><div class="title serif">血月</div><div class="meta">Frame</div></div></div>
      </div>

      <div class="signal-node text signal-manifesto">
        <div class="node-kicker">Manifesto</div>
        <div class="node-title serif">项目最大，影像次之，写作只保留标题。这不是内容均分，而是信号分级。</div>
        <div class="node-meta">Field Logic / Homepage System</div>
      </div>

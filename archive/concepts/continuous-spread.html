<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>37ORBIT · 连续版式</title>
  <link rel="stylesheet" href="/concepts/shared.css" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">37ORBIT</div>
      <div class="nav"><a href="/concepts/index.html">返回概念目录</a><span>连续版式</span></div>
    </div>
    <section class="surface spread-layout">
      <div class="spread-hero">
        <div class="image-fill" style="position:absolute; inset:0; border-radius:20px; overflow:hidden;">
          <img src="/annual/2025/IMG_5856.JPG" alt="">
        </div>
        <div style="position:absolute; left:18px; top:18px; z-index:1;">
          <div class="eyebrow">Continuous Spread</div>
          <div class="serif" style="margin-top:10px;font-size:54px;line-height:0.92;max-width:10ch;">整页是一张版面，不再分块。</div>
        </div>
        <div class="overlay-bottom">
          <div class="caption">
            <div class="title serif">海边那天</div>
            <div class="meta">Frame / 2025</div>
          </div>
        </div>
      </div>
      <aside class="spread-sidebar">
        <div class="spread-block">
          <div class="eyebrow">Writing</div>
          <div class="list" style="margin-top:8px;">
            <a href="#"><div class="list-title serif">项目页和文章页不该在首页拥有相同视觉重量</div></a>
            <a href="#"><div class="list-title serif">真正的问题不是栏目太多，而是每个栏目都太像</div></a>
            <a href="#"><div class="list-title serif">影像应该被看见，而不是被压缩成一行标题</div></a>
          </div>
        </div>
        <div class="spread-block">
          <div class="eyebrow">Project Note</div>
          <div class="serif" style="margin-top:8px;font-size:30px;line-height:1.06;">模块仍然存在，但边界退后了。</div>
        </div>
      </aside>
      <div class="spread-bottom">
        <div class="spread-block">
          <div class="eyebrow">Project 01</div>
          <div class="serif" style="margin-top:8px;font-size:28px;line-height:1.08;">一件代表性作品</div>
          <div class="muted" style="margin-top:8px;max-width:30ch;">最大的篇幅给最重要的事，而不是平均分配给所有栏目。</div>
        </div>
        <div class="spread-block">
          <div class="eyebrow">Project 02</div>
          <div class="serif" style="margin-top:8px;font-size:28px;line-height:1.08;">另一个折腾</div>
          <div class="muted" style="margin-top:8px;">保留过程感和实验性。</div>
        </div>
        <div class="spread-block">
          <div class="eyebrow">Writing 03</div>
          <div class="serif" style="margin-top:8px;font-size:28px;line-height:1.08;">为什么这个站不想做成简历风格</div>
          <div class="muted" style="margin-top:8px;">首页像展开的双页，而不是卡片墙。</div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
